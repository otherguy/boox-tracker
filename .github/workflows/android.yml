---
name: Android checks

# Only changes that can affect the app or its build run the Gradle job; documentation and
# lint configuration are covered by the Lint workflow.
'on':
  push:
    branches: [main]
    paths: &android-paths
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.tool-versions'
      - '.editorconfig'
      - '.github/workflows/android.yml'
  pull_request:
    paths: *android-paths
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Tests and APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v4.3.0
        with:
          install_args: java android-sdk gradle python
      - name: Android SDK
        run: |
          set +o pipefail
          yes | mise exec -- android --no-metrics sdk install platforms/android-36 build-tools/35.0.0
          set -o pipefail
      # Caches Gradle's dependencies and build cache; only runs on main write it.
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Tests, lint, and APK
        run: mise exec -- ./gradlew testDebugUnitTest lintDebug lintDiagnostic assembleDebug
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: boox-tracker-debug
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*.html
