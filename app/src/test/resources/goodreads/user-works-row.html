<tr itemscope itemtype="http://schema.org/Book">
  <td width="5%" valign="top">
    <div id="{{BOOK_ID}}" class="u-anchorTarget"></div>
    <a title="{{TITLE}}" href="/book/show/{{BOOK_ID}}-synthetic-book"><img alt="{{TITLE}}" class="bookCover" itemprop="image" src="https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/0000000000l/{{BOOK_ID}}._SX50_.jpg" /></a>
  </td>
  <td width="100%" valign="top">
    <a class="bookTitle" itemprop="url" href="/book/show/{{BOOK_ID}}-synthetic-book">
      <span itemprop='name' role='heading' aria-level='4'>{{TITLE}}</span>
</a>    <br/>
    <span class='by'>by</span>
<span itemprop='author' itemscope='' itemtype='http://schema.org/Person'>
<div class='authorName__container'>
<a class="authorName" itemprop="url" href="https://www.goodreads.com/author/show/1.Test_Author"><span itemprop="name">{{AUTHOR}}</span></a>
</div>
</span>
    <div><span class="greyText">{{FORMAT}}</span><a class="right actionLink" href="#">delete review</a></div>
  </td>
  <td width="130px" >
    <div class='wtrButtonContainer' id='1_book_{{BOOK_ID}}'>
<div class='wtrDown wtrLeft wtrStatusReadingNow'>
<form action="/review/destroy/{{BOOK_ID}}-synthetic-book" accept-charset="UTF-8" method="post"><input name="utf8" type="hidden" value="&#x2713;" /><input type="hidden" name="authenticity_token" value="{{CSRF}}" />
<input type="hidden" name="unique_id" id="unique_id" value="1_book_{{BOOK_ID}}" />
<button class='wtrStatusReadingNow wtrUnshelve' title='Remove this book from your shelves' type='submit'></button>
</form>
<span title='{{SHELF_LABEL}}'>{{SHELF_LABEL}}</span>
{{PROGRESS_FORM}}
</div>
<div class='wtrDown wtrRight' data-exclusive-shelf='{{SHELF}}' data-shelves=''>
<form class="hiddenShelfForm" action="/shelf/add_to_shelf" accept-charset="UTF-8" method="post"><input name="utf8" type="hidden" value="&#x2713;" /><input type="hidden" name="authenticity_token" value="{{CSRF}}" />
<input type="hidden" name="unique_id" id="unique_id" value="1_book_{{BOOK_ID}}" />
<input type="hidden" name="book_id" id="book_id" value="{{BOOK_ID}}" />
<input type="hidden" name="name" id="name" value="" />
</form>
</div>
</div>
  </td>
</tr>
